name: Daily Market Data Update

on:
  schedule:
    # Runs daily at 10:53 PM IST (17:23 UTC)
    - cron: '23 17 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update-market-data:
    name: Update NSE & BSE Market Data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium & System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run updateMarketData (NSE & F&O)
        run: npm run updateMarketData

      - name: Run updateBseEquity (BSE Scrip Master)
        run: npm run updateBseEquity

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/nse_equity.csv public/eq_etfseclist.csv public/fo_mktlots.csv public/bse_equity.csv
          if git diff --staged --quiet; then
            echo "No changes detected in CSV data files."
          else
            git commit -m "chore(data): daily market data update [skip ci]"
            git push origin main
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bse-debug-artifacts
          path: |
            bse-debug-failure.*
          if-no-files-found: ignore
